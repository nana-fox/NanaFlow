<!doctype html>
<html lang="zh-Hans">
  <head>
    <title>封锁</title>
    <meta name="description" content="Blocked">
    <meta charset="UTF-8">
    <style>
      html {
        height: 100%;
        width: 100%;
        text-align: center;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        background-color: #C8E1D7;
      }
      body {
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      div {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(-50%);
        white-space: nowrap;
      }
      h1 {
        color: #267866;
        font-size: 4em;
        letter-spacing: 1px;
      }
      p {
        color: #267866;
        font-size: 1.5em;
        line-height: 1.5em;
        letter-spacing: 0.5px;
      }
      @media (prefers-color-scheme: dark) {
        html { background-color: #194E42; }
        h1, p { color: #C8E1D7; }
      }
    </style>
  </head>
  <body>
    <div>
      <img src="NanaFlowBlockedIcon.png" width="150" height="150" alt="NanaFlow">
      <h1>封锁</h1>
      <p>该网站在您的黑名单中。 NanaFlow 为您屏蔽了它，因此您可以专注于您的任务。</p>
    </div>
  </body>
</html>
